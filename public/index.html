<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#002b44" />
    <title>Tablero Marketing · YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <div class="shell">
      <div class="atmosphere" aria-hidden="true">
        <div class="mesh"></div>
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="grid-lines"></div>
        <div class="grain"></div>
      </div>

      <header class="hero">
        <div class="hero-wash" aria-hidden="true"></div>
        <div class="hero-inner">
          <img
            class="brand"
            src="./assets/logo-yaavs-white.png"
            alt="YAAVS"
            width="160"
            height="160"
          />
          <h1>Tablero Marketing</h1>
          <p class="lede">
            Formularios y resultados de Marketing en un solo lugar.
          </p>
          <p class="hero-meta">
            <span id="panelCount">0 accesos</span>
            <span class="sep" aria-hidden="true">·</span>
            <span class="live"><span class="live-dot" aria-hidden="true"></span> En vivo</span>
          </p>
        </div>
      </header>

      <main class="page">
        <section class="board" aria-labelledby="boardTitle">
          <div class="board-head">
            <div>
              <p class="section-kicker">Accesos</p>
              <h2 id="boardTitle">Elige una tarjeta</h2>
            </div>
            <p class="section-note">Abre el formulario o revisa las respuestas.</p>
          </div>

          <div class="toolbar">
            <label class="search">
              <span class="sr-only">Buscar tarjeta</span>
              <span class="search-icon" aria-hidden="true"></span>
              <input
                type="search"
                id="q"
                placeholder="Buscar por nombre o tipo…"
                autocomplete="off"
              />
            </label>
            <div class="filters" id="filters" role="group" aria-label="Filtrar por tipo"></div>
          </div>

          <section class="grid" id="grid" aria-label="Tablero Marketing"></section>
          <p class="empty" id="empty" hidden>No hay tarjetas con ese filtro.</p>
        </section>
      </main>

      <footer class="foot">
        <p>YAAVS · Tablero Marketing</p>
      </footer>
    </div>

    <script src="./config.js?v=5"></script>
    <script src="./app.js?v=5" defer></script>
  </body>
</html>
