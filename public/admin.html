<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#002b44" />
    <title>Centro de control · YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=7" />
  </head>
  <body class="admin-body">
    <div class="shell">
      <div class="atmosphere" aria-hidden="true">
        <div class="mesh"></div>
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="grid-lines"></div>
        <div class="grain"></div>
      </div>

      <header class="hero admin-hero">
        <div class="hero-wash" aria-hidden="true"></div>
        <div class="hero-inner">
          <img
            class="brand"
            src="./assets/logo-yaavs-white.png"
            alt="YAAVS"
            width="160"
            height="160"
          />
          <h1>Centro de control</h1>
          <p class="lede">Edita paneles del Tablero Marketing sin tocar código.</p>
          <p class="hero-meta">
            <a class="hero-link" href="./">Ver tablero público</a>
            <span class="sep" aria-hidden="true">·</span>
            <button type="button" class="hero-link as-btn" id="logoutBtn" hidden>Salir</button>
          </p>
        </div>
      </header>

      <main class="page admin-page">
        <section class="board" id="loginCard">
          <div class="board-head">
            <div>
              <p class="section-kicker">Acceso</p>
              <h2>Inicia sesión</h2>
            </div>
            <p class="section-note">Solo para quien administra el directorio.</p>
          </div>
          <form class="admin-login" id="loginForm">
            <label>
              <span>Contraseña</span>
              <input type="password" id="password" name="password" autocomplete="current-password" required />
            </label>
            <button type="submit" class="btn-primary">Entrar</button>
            <p class="admin-msg" id="loginMsg" hidden></p>
          </form>
        </section>

        <section class="board admin-board" id="adminCard" hidden>
          <div class="board-head">
            <div>
              <p class="section-kicker">Paneles</p>
              <h2>Administrar accesos</h2>
            </div>
            <div class="admin-toolbar">
              <button type="button" class="btn-secondary" id="newBtn">Nuevo panel</button>
              <button type="button" class="btn-secondary" id="exportBtn">Exportar JSON</button>
              <label class="btn-secondary as-label">
                Importar JSON
                <input type="file" id="importFile" accept="application/json,.json" hidden />
              </label>
            </div>
          </div>
          <p class="admin-msg" id="adminMsg" hidden></p>
          <div class="admin-list" id="adminList"></div>
        </section>
      </main>

      <footer class="foot">
        <p>YAAVS · Centro de control</p>
      </footer>
    </div>

    <script src="./admin.js?v=7" defer></script>
  </body>
</html>
